<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Bespaar-Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #f4f4f9; --card: #ffffff; --text: #333; --border: #ddd; }
        body.dark-mode { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --border: #444; }
        body { font-family: sans-serif; padding: 10px; background-color: var(--bg); color: var(--text); }
        .card { background: var(--card); border: 1px solid var(--border); padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        
        .btn-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px;}
        button { padding: 8px; cursor: pointer; border: none; border-radius: 4px; font-size: 11px; color: white; flex: 1 1 30%; transition: 0.2s; }
        
        .btn-transfer { background-color: #f39c12; margin-top: 5px; display: block; width: 100%; font-weight: bold; font-size: 12px; }
        
        .bottom-actions { display: flex; gap: 5px; margin-top: 10px; }
        .btn-undo { background-color: #e67e22; flex: 1; }
        .btn-redo { background-color: #3498db; flex: 1; }
        .btn-reset { background-color: #c0392b; flex: 1; }
        .btn-dark { background-color: #7f8c8d; display: block; width: 100%; margin-top: 5px; }
        
        .timestamp { font-size: 11px; font-style: italic; color: #7f8c8d; text-align: center; margin-bottom: 5px; }
        
        .chart-container { height: 260px; width: 100%; }
        .info-text { font-size: 14px; margin: 5px 0; }
        .highlight { color: #f39c12; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 5px; }
        th, td { padding: 6px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: bold; }
        .amount-plus { color: #27ae60; font-weight: bold; }
        .amount-min { color: #e67e22; font-weight: bold; }
        .loading { text-align: center; font-style: italic; color: #7f8c8d; padding: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="dynamicButtons" class="btn-container"></div>
        
        <div id="lastTimestamp" class="timestamp" style="margin-top: 10px;">Laatste besparing: -</div>

        <button class="btn-transfer" onclick="logTransfer()">Overschrijven naar rekening</button>
        <div id="lastTransferTimestamp" class="timestamp" style="margin-top: 5px;">Laatste overschrijving: -</div>

        <button class="btn-dark" onclick="toggleDarkMode()">Dark Mode</button>
    </div>

    <div class="card">
        <div id="loadingMessage" class="loading">Data synchroniseren met de cloud...</div>
        <div class="chart-container"><canvas id="myChart"></canvas></div>
        
        <div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border);">
            <p id="totalSaved" class="info-text">Totaal bespaard: €0,00</p>
            <p id="totalTransferred" class="info-text">Overgeschreven: €0,00</p>
            <p id="remainingSaved" class="info-text highlight">Resterend budget: €0,00</p>
            <p id="investResult" class="info-text">Waarde na 10 jaar (7%): €0,00</p>
        </div>

        <div class="bottom-actions">
            <button class="btn-undo" onclick="undoLastAction()">Ongedaan maken</button>
            <button class="btn-redo" onclick="redoAction()">Opnieuw</button>
            <button class="btn-reset" onclick="resetData()">Alles wissen</button>
        </div>
    </div>

    <div class="card">
        <h3 style="font-size: 14px; margin-top: 0; margin-bottom: 5px;">Laatste 10 Acties</h3>
        <table>
            <thead><tr><th>Datum</th><th>Actie</th><th>Bedrag</th></tr></thead>
            <tbody id="actionHistory"></tbody>
        </table>
    </div>

    <script>
        // --- 1. FIREBASE CONFIGURATIE ---
        const firebaseConfig = {
            apiKey: "AIzaSyADvgY4kOydK8b7k_yQ7ZIpz-1Zyoh9S04",
            authDomain: "apps-26402.firebaseapp.com",
            projectId: "apps-26402",
            storageBucket: "apps-26402.firebasestorage.app",
            messagingSenderId: "401909070997",
            appId: "1:401909070997:web:d494c0e8436bb80c2f6f9c",
            measurementId: "G-6L7YVTSX32"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cloudData = [];
        let cloudTransfers = [];
        let redoStack = []; 
        let editMode = false; 
        
        let buttonsConfig = [
            { name: 'Geen soep', amount: 1.50, color: '#27ae60' },
            { name: 'Geen water', amount: 0.19, color: '#2980b9' },
            { name: 'Auto wassen', amount: 17.00, color: '#8e44ad' },
            { name: 'Geen koffie', amount: 0.35, color: '#d35400' },
            { name: 'Thuiswerken do', amount: 1.26, color: '#16a085' },
            { name: 'Geen collect & go', amount: 5.95, color: '#c0392b' }
        ];

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        
        function getColor(type) { 
            if (type === 'Historie') return '#95a5a6';
            if (type === 'Andere') return '#34495e';
            let found = buttonsConfig.find(b => b.name === type);
            return found ? found.color : '#7f8c8d'; 
        }

        // Luister naar knoppenconfiguratie in de cloud
        db.collection("settings").doc("buttonConfig").onSnapshot((doc) => {
            if (doc.exists) {
                buttonsConfig = doc.data().buttons || buttonsConfig;
            } else {
                db.collection("settings").doc("buttonConfig").set({ buttons: buttonsConfig });
            }
            renderButtons();
            updateUI(); 
        }, (error) => {
            console.log("Settings snapshot error, fallback naar standaard:", error);
            renderButtons();
        });

        // --- 2. DYNAMISCHE KNOPPEN BEREKENEN ---
        function toggleEditMode() {
            editMode = !editMode;
            renderButtons();
        }

        function renderButtons() {
            const container = document.getElementById('dynamicButtons');
            container.innerHTML = '';
            
            buttonsConfig.forEach((btn, index) => {
                const buttonEl = document.createElement('button');
                
                if (editMode) {
                    buttonEl.innerText = `✏️ ${btn.name}`;
                    buttonEl.style.backgroundColor = btn.color;
                    buttonEl.style.opacity = "0.7"; 
                    buttonEl.style.border = "1px dashed #333";
                    buttonEl.onclick = () => manageCategory(index);
                } else {
                    buttonEl.innerText = `${btn.name} (±€${btn.amount.toFixed(2).replace('.', ',')})`;
                    buttonEl.style.backgroundColor = btn.color;
                    buttonEl.onclick = () => handleButtonClick(index, btn.name, btn.amount);
                }
                container.appendChild(buttonEl);
            });

            if (!editMode) {
                const andereBtn = document.createElement('button');
                andereBtn.innerText = 'Andere...';
                andereBtn.style.backgroundColor = '#34495e';
                andereBtn.onclick = promptAndere;
                container.appendChild(andereBtn);

                const addBtn = document.createElement('button');
                addBtn.innerText = '+ Nieuwe Categorie';
                addBtn.style.backgroundColor = '#7f8c8d';
                addBtn.onclick = addCategory;
                container.appendChild(addBtn);
            }

            const editBtn = document.createElement('button');
            if (editMode) {
                editBtn.innerText = '✅ Klaar met bewerken';
                editBtn.style.backgroundColor = '#2ecc71';
                editBtn.style.width = '100%'; 
            } else {
                editBtn.innerText = '⚙️ Knoppen bewerken';
                editBtn.style.backgroundColor = '#95a5a6';
            }
            editBtn.onclick = toggleEditMode;
            container.appendChild(editBtn);
        }

        // --- 3. CATEGORIEËN BEHEREN ---
        function manageCategory(index) {
            let oudeNaam = buttonsConfig[index].name;
            let actie = prompt(`Wat wil je doen met '${oudeNaam}'?\n\nTyp 1 voor: Naam wijzigen\nTyp 2 voor: Verwijderen\nTyp 3 voor: Annuleren`, "1");
            
            if (actie === "1") {
                let nieuweNaam = prompt("Wat wordt de nieuwe naam?", oudeNaam);
                if (nieuweNaam && nieuweNaam.trim() !== "" && nieuweNaam !== oudeNaam) {
                    buttonsConfig[index].name = nieuweNaam.trim();
                    db.collection("settings").doc("buttonConfig").set({ buttons: buttonsConfig });
                    
                    if (confirm(`Wil je ook al je eerdere besparingen in de geschiedenis veranderen van '${oudeNaam}' naar '${nieuweNaam.trim()}'?`)) {
                        cloudData.forEach(item => {
                            if (item.type === oudeNaam) {
                                db.collection("besparingen").doc(item.id).update({ type: nieuweNaam.trim() });
                            }
                        });
                    }
                }
            } else if (actie === "2") {
                if (confirm(`Weet je zeker dat je de knop '${oudeNaam}' wilt verwijderen?`)) {
                    buttonsConfig.splice(index, 1);
                    db.collection("settings").doc("buttonConfig").set({ buttons: buttonsConfig });
                }
            }
            renderButtons();
        }

        // --- 4. ACTIES: OPSLAAN & TOEVOEGEN ---
        function handleButtonClick(index, currentType, currentAmount) {
            let input = prompt(`Bevestig bedrag voor '${currentType}':`, currentAmount.toFixed(2).replace('.', ','));
            if (input !== null && input.trim() !== "") {
                let bedrag = parseFloat(input.replace(',', '.'));
                if (!isNaN(bedrag) && bedrag > 0) {
                    redoStack = []; 
                    db.collection("besparingen").add({ date: new Date().toISOString(), amount: bedrag, type: currentType });
                    
                    if (bedrag !== currentAmount) {
                        if (confirm(`Wil je €${bedrag.toFixed(2).replace('.', ',')} instellen als het vaste standaardbedrag voor '${currentType}'?`)) {
                            buttonsConfig[index].amount = bedrag;
                            db.collection("settings").doc("buttonConfig").set({ buttons: buttonsConfig });
                        }
                    }
                }
            }
        }

        function promptAndere() {
            let desc = prompt("Wat heb je bespaard?");
            if (!desc) return;
            let input = prompt(`Hoeveel heb je bespaard met '${desc}'?`);
            if (input !== null && input.trim() !== "") {
                let bedrag = parseFloat(input.replace(',', '.'));
                if (!isNaN(bedrag) && bedrag > 0) {
                    redoStack = []; 
                    db.collection("besparingen").add({ date: new Date().toISOString(), amount: bedrag, type: 'Andere', note: desc });
                }
            }
        }

        function addCategory() {
            let name = prompt("Naam van de nieuwe besparing:");
            if (!name || name.trim() === "") return;
            let amountStr = prompt("Standaard bedrag? (€):");
            if (!amountStr) return;
            let amount = parseFloat(amountStr.replace(',', '.'));
            if (!isNaN(amount) && amount > 0) {
                let colors = ['#f1c40f', '#e74c3c', '#9b59b6', '#3498db', '#1abc9c', '#d35400'];
                let randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                buttonsConfig.push({ name: name, amount: amount, color: randomColor });
                db.collection("settings").doc("buttonConfig").set({ buttons: buttonsConfig });
            }
        }

        function logTransfer() {
            let input = prompt("Hoeveel overgemaakt naar rekening? (€)");
            if (input) {
                let bedrag = parseFloat(input.replace(',', '.'));
                if (!isNaN(bedrag) && bedrag > 0) {
                    redoStack = []; 
                    db.collection("overschrijvingen").add({ date: new Date().toISOString(), amount: bedrag });
                }
            }
        }

        // --- 5. UNDO & REDO ---
        function undoLastAction() {
            if (cloudData.length === 0 && cloudTransfers.length === 0) return alert("Niets om ongedaan te maken.");
            
            let lastData = cloudData[cloudData.length - 1];
            let lastTransfer = cloudTransfers[cloudTransfers.length - 1];
            let lastDataTime = lastData ? new Date(lastData.date).getTime() : 0;
            let lastTransferTime = lastTransfer ? new Date(lastTransfer.date).getTime() : 0;

            if (lastDataTime > lastTransferTime) {
                let backup = { ...lastData }; delete backup.id; 
                redoStack.push({ collection: "besparingen", data: backup });
                db.collection("besparingen").doc(lastData.id).delete();
            } else {
                let backup = { ...lastTransfer }; delete backup.id;
                redoStack.push({ collection: "overschrijvingen", data: backup });
                db.collection("overschrijvingen").doc(lastTransfer.id).delete();
            }
        }

        function redoAction() {
            if (redoStack.length === 0) return alert("Niets om opnieuw uit te voeren.");
            let restoreItem = redoStack.pop();
            db.collection(restoreItem.collection).add(restoreItem.data);
        }

        function resetData() {
            if (confirm("ALLES wissen uit de cloud? (Knoppen blijven bestaan)")) {
                cloudData.forEach(item => { if(item.type !== 'Historie') db.collection("besparingen").doc(item.id).delete(); });
                cloudTransfers.forEach(item => db.collection("overschrijvingen").doc(item.id).delete());
                redoStack = []; 
            }
        }

        // --- 6. LIVE SYNC ---
        db.collection("besparingen").orderBy("date", "asc").onSnapshot((snapshot) => {
            cloudData = [];
            snapshot.forEach((doc) => { let docData = doc.data(); docData.id = doc.id; cloudData.push(docData); });
            document.getElementById('loadingMessage').style.display = 'none';
            updateUI();
        });

        db.collection("overschrijvingen").orderBy("date", "asc").onSnapshot((snapshot) => {
            cloudTransfers = [];
            snapshot.forEach((doc) => { let docData = doc.data(); docData.id = doc.id; cloudTransfers.push(docData); });
            updateUI();
        });

        const topLabelsPlugin = {
            id: 'topLabels',
            afterDatasetsDraw(chart) {
                const { ctx, scales: { x, y } } = chart;
                chart.data.labels.forEach((label, i) => {
                    let total = 0; let metaDataForX = null;
                    chart.data.datasets.forEach((dataset, datasetIndex) => {
                        const val = dataset.data[i];
                        if (val) { total += val; if (!metaDataForX) { const meta = chart.getDatasetMeta(datasetIndex); if (meta.data[i]) metaDataForX = meta.data[i].x; } }
                    });
                    if (total > 0 && metaDataForX) {
                        const yPos = y.getPixelForValue(total); ctx.save();
                        ctx.fillStyle = document.body.classList.contains('dark-mode') ? '#e0e0e0' : '#333';
                        ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
                        ctx.fillText('€' + total.toFixed(2).replace('.', ','), metaDataForX, yPos - 5); ctx.restore();
                    }
                });
            }
        };

        // --- 7. UI REFRESH ---
        function updateUI() {
            try {
                let allActions = []; let monthlyData = {};
                let lastSaveDate = null; let lastTransferDate = null;

                const totalSaved = cloudData.reduce((sum, item) => sum + Number(item.amount), 0);
                const totalTransferred = cloudTransfers.reduce((sum, item) => sum + Number(item.amount), 0);
                const remaining = totalSaved - totalTransferred;
                let futureValue = totalSaved * Math.pow(1.07, 10);
                
                document.getElementById('totalSaved').innerText = `Totaal bespaard: €${totalSaved.toFixed(2).replace('.', ',')}`;
                document.getElementById('totalTransferred').innerText = `Overgeschreven: €${totalTransferred.toFixed(2).replace('.', ',')}`;
                document.getElementById('remainingSaved').innerText = `Resterend budget: €${remaining.toFixed(2).replace('.', ',')}`;
                document.getElementById('investResult').innerText = `Waarde na 10 jaar (7%): €${futureValue.toFixed(2).replace('.', ',')}`;

                cloudData.forEach(item => {
                    if (!item.date) return;
                    let itemDate = new Date(item.date);
                    if (!lastSaveDate || itemDate > lastSaveDate) lastSaveDate = itemDate;

                    const month = itemDate.toLocaleString('nl-NL', { month: 'short', year: '2-digit' });
                    let type = item.type || 'Overig';
                    if (type.includes('Historie') || type.includes('Correctie')) type = 'Historie'; 
                    
                    if (!monthlyData[month]) monthlyData[month] = {};
                    if (monthlyData[month][type] === undefined) monthlyData[month][type] = 0;
                    monthlyData[month][type] += Number(item.amount);
                    
                    let displayName = item.note ? `Andere (${item.note})` : type;
                    allActions.push({ date: itemDate, type: displayName, amount: Number(item.amount), isTransfer: false });
                });

                cloudTransfers.forEach(item => {
                    if (!item.date) return;
                    let itemDate = new Date(item.date);
                    if (!lastTransferDate || itemDate > lastTransferDate) lastTransferDate = itemDate;
                    allActions.push({ date: itemDate, type: 'Overschrijving', amount: Number(item.amount), isTransfer: true });
                });

                document.getElementById('lastTimestamp').innerText = lastSaveDate ? `Laatste besparing: ${lastSaveDate.toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}` : `Laatste besparing: -`;
                document.getElementById('lastTransferTimestamp').innerText = lastTransferDate ? `Laatste overschrijving: ${lastTransferDate.toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}` : `Laatste overschrijving: -`;

                allActions.sort((a, b) => b.date - a.date);
                const tbody = document.getElementById('actionHistory'); tbody.innerHTML = '';
                if (allActions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; font-style:italic;">Nog geen acties</td></tr>';
                } else {
                    allActions.slice(0, 10).forEach(act => {
                        let tr = document.createElement('tr');
                        let dateStr = act.date.toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                        let amtStr = (act.isTransfer ? '- €' : '+ €') + act.amount.toFixed(2).replace('.', ',');
                        tr.innerHTML = `<td>${dateStr}</td><td>${act.type}</td><td class="${act.isTransfer ? 'amount-min' : 'amount-plus'}">${amtStr}</td>`;
                        tbody.appendChild(tr);
                    });
                }

                let allTypes = new Set();
                Object.values(monthlyData).forEach(monthObj => { Object.keys(monthObj).forEach(type => allTypes.add(type)); });
                const labels = Object.keys(monthlyData);
                
                const datasets = Array.from(allTypes).map(type => {
                    return { label: type, data: labels.map(m => monthlyData[m][type] || 0), backgroundColor: getColor(type) };
                });

                const mergedDatasets = [];
                datasets.forEach(ds => {
                    let existing = mergedDatasets.find(m => m.label === ds.label);
                    if(existing) existing.data = existing.data.map((val, idx) => val + ds.data[idx]);
                    else mergedDatasets.push(ds);
                });

                const ctx = document.getElementById('myChart').getContext('2d');
                if (window.myChartObj) window.myChartObj.destroy();
                window.myChartObj = new Chart(ctx, {
                    type: 'bar', data: { labels: labels, datasets: mergedDatasets },
                    options: { 
                        maintainAspectRatio: false, responsive: true, layout: { padding: { top: 20 } }, 
                        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
                        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 8, font: {size: 10} } } }
                    },
                    plugins: [topLabelsPlugin] 
                });
            } catch (err) { console.error("Fout in updateUI:", err); }
        }

        // VOER DIT DIRECT UIT BIJ OPSTARTEN (Zorgt dat knoppen direct zichtbaar zijn)
        renderButtons();
    </script>
</body>
</html>
