<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soep Bespaar-Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background-color: #f4f4f9; }
        .card { background: white; border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .btn-container { display: flex; gap: 10px; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 6px; font-size: 14px; color: white; flex: 1; }
        .btn-geen { background-color: #27ae60; }
        .btn-wel { background-color: #c0392b; }
        .btn-reset { background-color: #7f8c8d; margin-top: 10px; }
        canvas { max-width: 100%; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Soep-tracker</h3>
        <div class="btn-container">
            <button class="btn-geen" onclick="logBesparing(1.50)">Geen soep (+€1,50)</button>
            <button class="btn-wel" onclick="logBesparing(0)">Wel soep</button>
        </div>
    </div>

    <div class="card">
        <h3>Maandoverzicht</h3>
        <canvas id="myChart"></canvas>
        <p id="totalSaved" style="margin-top:15px; font-weight:bold;">Totaal bespaard: €0,00</p>
    </div>

    <div class="card">
        <h3>Toekomstvisie (7% rendement)</h3>
        <p id="investResult">Besparingen na 10 jaar: €0,00</p>
        <button class="btn-reset" onclick="resetData()">Alles wissen</button>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('soepData')) || [];
        let myChart;

        function logBesparing(bedrag) {
            data.push({ date: new Date().toISOString(), amount: bedrag });
            localStorage.setItem('soepData', JSON.stringify(data));
            updateUI();
        }

        function resetData() {
            if (confirm("Weet je zeker dat je alle data wilt wissen?")) {
                data = [];
                localStorage.removeItem('soepData');
                updateUI();
            }
        }

        function updateUI() {
            const total = data.reduce((sum, item) => sum + item.amount, 0);
            document.getElementById('totalSaved').innerText = `Totaal bespaard: €${total.toFixed(2)}`;
            let futureValue = total * Math.pow(1.07, 10);
            document.getElementById('investResult').innerText = `Toekomstige waarde na 10 jaar: €${futureValue.toFixed(2)}`;

            const monthlyData = {};
            data.forEach(item => {
                const month = new Date(item.date).toLocaleString('nl-NL', { month: 'short', year: '2-digit' });
                monthlyData[month] = (monthlyData[month] || 0) + item.amount;
            });

            const ctx = document.getElementById('myChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(monthlyData),
                    datasets: [{ label: 'Besparing (€)', data: Object.values(monthlyData), backgroundColor: '#27ae60' }]
                },
                options: { scales: { y: { beginAtZero: true } } }
            });
        }
        updateUI();
    </script>
</body>
</html>
