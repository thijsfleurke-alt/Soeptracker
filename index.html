<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bespaar-Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f4f4f9; --card: #ffffff; --text: #333; --border: #ddd; }
        body.dark-mode { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --border: #444; }
        body { font-family: sans-serif; padding: 10px; background-color: var(--bg); color: var(--text); }
        .card { background: var(--card); border: 1px solid var(--border); padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        
        .btn-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px;}
        button { padding: 8px; cursor: pointer; border: none; border-radius: 4px; font-size: 11px; color: white; flex: 1 1 30%; }
        
        .btn-soep { background-color: #27ae60; }
        .btn-water { background-color: #2980b9; }
        .btn-auto { background-color: #8e44ad; }
        
        .btn-transfer { background-color: #f39c12; margin-top: 5px; display: block; width: 100%; font-weight: bold; font-size: 12px; }
        
        .bottom-actions { display: flex; gap: 5px; margin-top: 10px; }
        .btn-undo { background-color: #e67e22; flex: 1; }
        .btn-reset { background-color: #c0392b; flex: 1; }
        .btn-dark { background-color: #7f8c8d; display: block; width: 100%; margin-top: 5px; }
        
        .ticker-container { display: flex; gap: 5px; margin-bottom: 10px; font-size: 12px; }
        .ticker { padding: 4px; border-radius: 4px; color: white; font-weight: bold; flex: 1; text-align: center; }
        .timestamp { font-size: 11px; font-style: italic; color: #7f8c8d; text-align: center; margin-bottom: 5px; }
        
        .chart-container { height: 220px; width: 100%; }
        .info-text { font-size: 14px; margin: 5px 0; }
        .highlight { color: #f39c12; font-weight: bold; }

        /* Tabel styling */
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 5px; }
        th, td { padding: 6px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: bold; }
        .amount-plus { color: #27ae60; font-weight: bold; }
        .amount-min { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="btn-container">
            <button class="btn-soep" onclick="log(1.50, 'Geen soep')">Geen soep (+€1,50)</button>
            <button class="btn-water" onclick="log(0.19, 'Geen water')">Geen water (+€0,19)</button>
            <button class="btn-auto" onclick="log(17.00, 'Auto Zelf wassen')">Auto Zelf wassen (+€17)</button>
        </div>
        
        <div class="ticker-container">
            <span class="ticker btn-soep"><span id="countSoep">0</span>x</span>
            <span class="ticker btn-water"><span id="countWater">0</span>x</span>
            <span class="ticker btn-auto"><span id="countAuto">0</span>x</span>
        </div>
        <div id="lastTimestamp" class="timestamp">Laatste besparing: -</div>

        <button class="btn-transfer" onclick="logTransfer()">Overschrijven naar rekening</button>
        <div id="lastTransferTimestamp" class="timestamp" style="margin-top: 5px;">Laatste overschrijving: -</div>

        <button class="btn-dark" onclick="toggleDarkMode()">Dark Mode</button>
    </div>

    <div class="card">
        <div class="chart-container"><canvas id="myChart"></canvas></div>
        
        <div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border);">
            <p id="totalSaved" class="info-text">Totaal bespaard: €0,00</p>
            <p id="totalTransferred" class="info-text">Overgeschreven: €0,00</p>
            <p id="remainingSaved" class="info-text highlight">Resterend budget: €0,00</p>
            <p id="investResult" class="info-text">Waarde na 10 jaar (7%): €0,00</p>
        </div>

        <div class="bottom-actions">
            <button class="btn-undo" onclick="undoLastAction()">Ongedaan maken</button>
            <button class="btn-reset" onclick="resetData()">Alles wissen</button>
        </div>
    </div>

    <div class="card">
        <h3 style="font-size: 14px; margin-top: 0; margin-bottom: 5px;">Laatste 10 Acties</h3>
        <table>
            <thead>
                <tr>
                    <th>Datum</th>
                    <th>Actie</th>
                    <th>Bedrag</th>
                </tr>
            </thead>
            <tbody id="actionHistory">
                </tbody>
        </table>
    </div>

    <script>
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

        function safeLoad(key) {
            try {
                let data = JSON.parse(localStorage.getItem(key));
                if (!Array.isArray(data)) return [];
                return data.filter(item => item !== null && typeof item === 'object' && !isNaN(item.amount));
            } catch (e) {
                console.error("Fout bij laden van data:", e);
                return [];
            }
        }

        function safeSave(key, data) {
            try { localStorage.setItem(key, JSON.stringify(data)); } 
            catch (e) { alert("Browser blokkeert opslag."); }
        }

        function log(bedrag, type) {
            let data = safeLoad('soepData');
            data.push({ date: new Date().toISOString(), amount: Number(bedrag), type: type });
            safeSave('soepData', data);
            updateUI();
        }

        function logTransfer() {
            let input = prompt("Hoeveel wil je overschrijven naar je rekening? (€)");
            if (input) {
                let bedrag = parseFloat(input.replace(',', '.'));
                if (!isNaN(bedrag) && bedrag > 0) {
                    let transfers = safeLoad('transferData');
                    transfers.push({ date: new Date().toISOString(), amount: bedrag });
                    safeSave('transferData', transfers);
                    updateUI();
                } else {
                    alert("Vul alsjeblieft een geldig getal in.");
                }
            }
        }

        function undoLastAction() {
            let data = safeLoad('soepData');
            let transfers = safeLoad('transferData');

            let lastDataTime = data.length > 0 ? new Date(data[data.length - 1].date).getTime() : 0;
            let lastTransferTime = transfers.length > 0 ? new Date(transfers[transfers.length - 1].date).getTime() : 0;

            if (lastDataTime === 0 && lastTransferTime === 0) {
                alert("Er is niets om ongedaan te maken.");
                return;
            }

            if (lastDataTime > lastTransferTime) {
                data.pop();
                safeSave('soepData', data);
            } else {
                transfers.pop();
                safeSave('transferData', transfers);
            }
            updateUI();
        }

        function resetData() {
            if (confirm("Weet je zeker dat je alle data wilt wissen?")) {
                localStorage.removeItem('soepData');
                localStorage.removeItem('transferData');
                updateUI();
            }
        }

        function updateUI() {
            try {
                let data = safeLoad('soepData');
                let transfers = safeLoad('transferData');

                let countSoep = 0, countWater = 0, countAuto = 0;
                let lastSaveDate = null;
                let lastTransferDate = null;
                
                // Array voor de geschiedenis tabel
                let allActions = [];

                const totalSaved = data.reduce((sum, item) => sum + Number(item.amount), 0);
                const totalTransferred = transfers.reduce((sum, item) => sum + Number(item.amount), 0);
                const remaining = totalSaved - totalTransferred;
                let futureValue = totalSaved * Math.pow(1.07, 10);
                
                document.getElementById('totalSaved').innerText = `Totaal bespaard: €${totalSaved.toFixed(2)}`;
                document.getElementById('totalTransferred').innerText = `Overgeschreven: €${totalTransferred.toFixed(2)}`;
                document.getElementById('remainingSaved').innerText = `Resterend budget: €${remaining.toFixed(2)}`;
                document.getElementById('investResult').innerText = `Waarde na 10 jaar (7%): €${futureValue.toFixed(2)}`;

                const monthlyData = {};
                
                data.forEach(item => {
                    if (!item.date) return;
                    
                    let itemDate = new Date(item.date);
                    if (!lastSaveDate || itemDate > lastSaveDate) lastSaveDate = itemDate;

                    const month = itemDate.toLocaleString('nl-NL', { month: 'short', year: '2-digit' });
                    if (!monthlyData[month]) monthlyData[month] = { 'Geen soep': 0, 'Geen water': 0, 'Auto Zelf wassen': 0 };
                    
                    let type = item.type;
                    if (!type) {
                        if (item.amount === 1.5) type = 'Geen soep';
                        else if (item.amount === 0.19) type = 'Geen water';
                        else type = 'Geen soep';
                    }
                    if (type === 'Auto wassen') type = 'Auto Zelf wassen'; 
                    
                    if (type === 'Geen soep') countSoep++;
                    if (type === 'Geen water') countWater++;
                    if (type === 'Auto Zelf wassen') countAuto++;

                    if (monthlyData[month][type] !== undefined) {
                        monthlyData[month][type] += Number(item.amount);
                    }
                    
                    // Voeg toe aan geschiedenis array
                    allActions.push({ date: itemDate, type: type, amount: Number(item.amount), isTransfer: false });
                });

                transfers.forEach(item => {
                    if (!item.date) return;
                    let itemDate = new Date(item.date);
                    if (!lastTransferDate || itemDate > lastTransferDate) lastTransferDate = itemDate;
                    
                    // Voeg toe aan geschiedenis array
                    allActions.push({ date: itemDate, type: 'Overschrijving', amount: Number(item.amount), isTransfer: true });
                });

                document.getElementById('countSoep').innerText = countSoep;
                document.getElementById('countWater').innerText = countWater;
                document.getElementById('countAuto').innerText = countAuto;
                
                if (lastSaveDate) {
                    const timeString = lastSaveDate.toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    document.getElementById('lastTimestamp').innerText = `Laatste besparing: ${timeString}`;
                } else {
                    document.getElementById('lastTimestamp').innerText = `Laatste besparing: -`;
                }

                if (lastTransferDate) {
                    const transString = lastTransferDate.toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                    document.getElementById('lastTransferTimestamp').innerText = `Laatste overschrijving: ${transString}`;
                } else {
                    document.getElementById('lastTransferTimestamp').innerText = `Laatste overschrijving: -`;
                }

                // Tabel vullen met de 10 laatste acties
                allActions.sort((a, b) => b.date - a.date); // Sorteer nieuwste eerst
                const last10 = allActions.slice(0, 10);
                const tbody = document.getElementById('actionHistory');
                tbody.innerHTML = ''; // Maak leeg voor de update
                
                if (last10.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; font-style:italic;">Nog geen acties</td></tr>';
                } else {
                    last10.forEach(act => {
                        let tr = document.createElement('tr');
                        let dateStr = act.date.toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                        let amtStr = (act.isTransfer ? '- €' : '+ €') + act.amount.toFixed(2);
                        let amountClass = act.isTransfer ? 'amount-min' : 'amount-plus';
                        
                        tr.innerHTML = `<td>${dateStr}</td><td>${act.type}</td><td class="${amountClass}">${amtStr}</td>`;
                        tbody.appendChild(tr);
                    });
                }

                const labels = Object.keys(monthlyData);
                const dataSoep = labels.map(m => monthlyData[m]['Geen soep']);
                const dataWater = labels.map(m => monthlyData[m]['Geen water']);
                const dataAuto = labels.map(m => monthlyData[m]['Auto Zelf wassen']);

                const ctx = document.getElementById('myChart').getContext('2d');
                if (window.myChartObj) window.myChartObj.destroy();
                window.myChartObj = new Chart(ctx, {
                    type: 'bar',
                    data: { 
                        labels: labels, 
                        datasets: [
                            { label: 'Soep', data: dataSoep, backgroundColor: '#27ae60' },
                            { label: 'Water', data: dataWater, backgroundColor: '#2980b9' },
                            { label: 'Auto', data: dataAuto, backgroundColor: '#8e44ad' }
                        ] 
                    },
                    options: { 
                        maintainAspectRatio: false,
                        responsive: true,
                        scales: { 
                            x: { stacked: true },
                            y: { stacked: true, beginAtZero: true } 
                        },
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10 } }
                        }
                    }
                });
            } catch (err) {
                console.error("Fout in updateUI:", err);
            }
        }
        
        updateUI();
    </script>
</body>
</html>
